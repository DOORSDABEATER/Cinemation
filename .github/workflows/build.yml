
name: Build DeSCinematicEngine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract plugin source
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No source ZIP found!"
            exit 1
          fi
          unzip -q "$ZIP" -d source

      - name: Build plugin
        run: |
          BUILD_FILE=$(find source -name build.gradle | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          gradle -p "$PROJECT_DIR" clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeSCinematicEngine
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
