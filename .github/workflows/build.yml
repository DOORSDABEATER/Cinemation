
name: Build DeSCinematicEngine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract fixed source ZIP
        run: |
          mkdir -p source
          unzip -q DeSCinematicEngine-slice6-FIXED.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build plugin and run core tests
        run: gradle -p source/DeSCinematicEngine clean build -x test

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeSCinematicEngine-JAR
          path: source/DeSCinematicEngine/build/libs/*.jar
          if-no-files-found: error
          
